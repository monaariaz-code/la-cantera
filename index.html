<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Cantera · Tendencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --piedra: #26323A;
    --granito: #5E6C74;
    --caliza: #E4E8E5;
    --veta: #2A7F7A;
    --casco: #F2C200;
    --blanco: #FAFBFA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Archivo', system-ui, sans-serif;
    background: var(--caliza);
    color: var(--piedra);
    line-height: 1.5;
  }
  .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }

  aside { background: var(--piedra); color: var(--blanco); padding: 32px 24px; }
  aside h1 {
    font-stretch: 62%;
    font-weight: 800;
    font-size: 40px;
    line-height: 0.95;
    margin: 0 0 6px;
    text-transform: none;
  }
  aside .fecha { color: #AEB9BE; font-size: 14px; margin: 0 0 32px; }
  nav { display: flex; flex-direction: column; gap: 4px; }
  nav button {
    font: inherit;
    text-align: left;
    background: none;
    color: #D3DADD;
    border: 0;
    border-left: 4px solid transparent;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 16px;
  }
  nav button:hover { color: var(--blanco); }
  nav button[aria-pressed="true"] {
    color: var(--blanco);
    border-left-color: var(--casco);
    background: rgba(255,255,255,0.06);
    font-weight: 600;
  }
  nav button:focus-visible { outline: 2px solid var(--casco); outline-offset: 2px; }

  main { padding: 40px 48px; max-width: 900px; }
  main h2 { font-stretch: 75%; font-weight: 800; font-size: 44px; margin: 0 0 4px; line-height: 1; }
  .estado { color: var(--granito); font-size: 14px; margin: 0 0 32px; }
  h3 { font-size: 18px; font-weight: 700; margin: 36px 0 12px; }

  /* Estratos: cada palabra clave es una capa de roca */
  .estratos { background: var(--blanco); padding: 8px 0; }
  .capa { display: grid; grid-template-columns: 200px 1fr 56px; align-items: center; gap: 16px; padding: 10px 20px; }
  .capa + .capa { border-top: 1px solid var(--caliza); }
  .capa .nombre { font-weight: 600; }
  .capa .pista { background: var(--caliza); height: 18px; }
  .capa .barra { height: 100%; background: var(--granito); }
  .capa:nth-child(1) .barra { background: var(--veta); }
  .capa:nth-child(2) .barra { background: #4F9B96; }
  .capa .valor { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }

  .ideas { display: flex; flex-direction: column; gap: 12px; }
  .idea { background: var(--blanco); padding: 16px 20px; border-left: 6px solid var(--casco); }
  .idea .plataforma { font-size: 13px; color: var(--granito); font-weight: 600; }
  .idea h4 { margin: 2px 0 4px; font-size: 18px; }
  .idea p { margin: 0; color: #3C4A52; }

  .aviso { background: var(--blanco); border-left: 6px solid var(--veta); padding: 12px 20px; font-size: 14px; margin-bottom: 24px; }
  .vacio { padding: 20px; color: var(--granito); }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    aside { padding: 20px; }
    nav { flex-direction: row; overflow-x: auto; }
    nav button { border-left: 0; border-bottom: 4px solid transparent; white-space: nowrap; }
    nav button[aria-pressed="true"] { border-bottom-color: var(--casco); }
    main { padding: 24px 20px; }
    main h2 { font-size: 34px; }
    .capa { grid-template-columns: 1fr 48px; }
    .capa .pista { grid-column: 1 / -1; grid-row: 2; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>La Cantera</h1>
    <p class="fecha" id="fecha"></p>
    <nav id="menu" aria-label="Categorías"></nav>
  </aside>
  <main>
    <h2 id="titulo"></h2>
    <p class="estado" id="estado"></p>
    <div id="contenido"></div>
  </main>
</div>

<script>
/* ============================================================
   1. CONTENIDO EDITABLE
   Ideas y campañas: por ahora se escriben a mano (o las genera
   otro script más adelante). Reemplaza estos ejemplos.
   ============================================================ */
const CATEGORIAS = [
  { id: 'gastronomia', nombre: 'Gastronomía' },
  { id: 'moda',        nombre: 'Moda' },
  { id: 'deporte',     nombre: 'Deporte' },
  { id: 'campanas',    nombre: 'Campañas exitosas' }
];

const IDEAS = {
  gastronomia: [
    { plataforma: 'TikTok', titulo: 'Receta con tres ingredientes', desc: 'Formato corto y rápido, con el reto de no sumar ningún ingrediente más.' },
    { plataforma: 'Instagram Reels', titulo: 'Comida callejera reinventada', desc: 'Un plato tradicional con un giro gourmet, grabado en el puesto original.' }
  ],
  moda: [
    { plataforma: 'TikTok', titulo: 'Una prenda, cinco looks', desc: 'Transiciones rápidas que muestran lo versátil de una prenda básica.' },
    { plataforma: 'Instagram', titulo: 'Armario cápsula del mes', desc: 'Selección corta de prendas combinables, con enlaces a las marcas.' }
  ],
  deporte: [
    { plataforma: 'TikTok', titulo: 'Reto de 30 segundos', desc: 'Un ejercicio, un cronómetro en pantalla y el audio del momento.' },
    { plataforma: 'Instagram Reels', titulo: 'Detrás de cámaras del entrenamiento', desc: 'Contenido sin producir: calentamiento, errores y progreso real.' }
  ]
};

const CAMPANAS = [
  { plataforma: 'Ejemplo', titulo: 'Reemplaza con una campaña real', desc: 'Escribe aquí el nombre de la marca, qué hizo, en qué red y por qué funcionó.' }
];

/* Datos de respaldo si todavía no existe tendencias_la_cantera.json */
const TENDENCIAS_EJEMPLO = {
  actualizado: 'datos de ejemplo',
  gastronomia: [
    { palabra_clave: 'recetas faciles', interes_promedio: 72 },
    { palabra_clave: 'comida saludable', interes_promedio: 55 },
    { palabra_clave: 'street food', interes_promedio: 31 }
  ],
  moda: [
    { palabra_clave: 'outfit del dia', interes_promedio: 64 },
    { palabra_clave: 'streetwear', interes_promedio: 41 }
  ],
  deporte: [
    { palabra_clave: 'rutina de ejercicio', interes_promedio: 80 },
    { palabra_clave: 'running', interes_promedio: 47 }
  ]
};

/* ============================================================
   2. LÓGICA
   ============================================================ */
let tendencias = TENDENCIAS_EJEMPLO;
let usandoEjemplo = true;
let activa = 'gastronomia';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

document.getElementById('fecha').textContent =
  new Date().toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

function dibujarMenu() {
  const menu = document.getElementById('menu');
  menu.innerHTML = CATEGORIAS.map(c =>
    `<button data-id="${c.id}" aria-pressed="${c.id === activa}">${esc(c.nombre)}</button>`
  ).join('');
  menu.querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => { activa = b.dataset.id; dibujar(); })
  );
}

function listaIdeas(items) {
  if (!items || !items.length) return '<p class="vacio">Aún no hay ideas cargadas para esta categoría.</p>';
  return '<div class="ideas">' + items.map(i => `
    <div class="idea">
      <div class="plataforma">${esc(i.plataforma)}</div>
      <h4>${esc(i.titulo)}</h4>
      <p>${esc(i.desc)}</p>
    </div>`).join('') + '</div>';
}

function estratos(items) {
  if (!items || !items.length) return '<p class="vacio">Sin datos de búsqueda para esta categoría.</p>';
  const orden = [...items].sort((a, b) => b.interes_promedio - a.interes_promedio);
  return '<div class="estratos">' + orden.map(t => `
    <div class="capa">
      <span class="nombre">${esc(t.palabra_clave)}</span>
      <div class="pista"><div class="barra" style="width:${Math.min(100, t.interes_promedio)}%"></div></div>
      <span class="valor">${Math.round(t.interes_promedio)}</span>
    </div>`).join('') + '</div>';
}

function dibujar() {
  dibujarMenu();
  const cat = CATEGORIAS.find(c => c.id === activa);
  document.getElementById('titulo').textContent = cat.nombre;
  const estado = document.getElementById('estado');
  const cont = document.getElementById('contenido');

  if (activa === 'campanas') {
    estado.textContent = 'Casos para inspirar a los influencers del pool.';
    cont.innerHTML = listaIdeas(CAMPANAS);
    return;
  }

  estado.textContent = usandoEjemplo
    ? 'Mostrando datos de ejemplo. Ejecuta el conector para ver datos reales.'
    : 'Búsquedas de los últimos 7 días. Actualizado: ' + tendencias.actualizado;

  cont.innerHTML =
    (usandoEjemplo ? '<div class="aviso">No se encontró tendencias_la_cantera.json. Estos números son de muestra.</div>' : '') +
    '<h3>Qué está buscando la gente</h3>' + estratos(tendencias[activa]) +
    '<h3>Ideas de contenido</h3>' + listaIdeas(IDEAS[activa]);
}

fetch('tendencias_la_cantera.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(datos => { tendencias = datos; usandoEjemplo = false; })
  .catch(() => { /* se queda con los datos de ejemplo */ })
  .finally(dibujar);
</script>
</body>
</html>
